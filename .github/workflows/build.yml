name: build

on:
  push:
    branches: [main]

# Permisos mínimos: leer el código y publicar la imagen
permissions:
  contents: read
  packages: write


jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vortex-cloud1997/vortex-web:${{ github.sha }}
            ghcr.io/vortex-cloud1997/vortex-web:main

